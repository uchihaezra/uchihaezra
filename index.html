<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UCHIHA EZRA /// SYSTEM V7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- GAYA NINJA UCHIHA V.7 --- */
        :root {
            --chakra-color: #ff0000;
            --dark-bg: #050505;
            --glass: rgba(0, 0, 0, 0.85);
            --border-glow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark-bg); margin: 0; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; color: var(--chakra-color); display: flex; justify-content: center; align-items: center; }
        body::after {
            content: " ";
            display: block;
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        
        #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.3; filter: grayscale(100%) contrast(1.2); }

        /* GRID */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; width: 100vw; height: 100vh; }
        .grid-item { border: 1px solid rgba(255,0,0,0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--glass); backdrop-filter: blur(5px); text-align: center; position: relative; }
        .sys-label { position: absolute; top: 5px; left: 5px; font-size: 0.6rem; opacity: 0.6; pointer-events: none; }

        /* CENTER PANEL (EXPANDABLE) */
        .center-panel { border: 2px solid var(--chakra-color); box-shadow: var(--border-glow); z-index: 50; cursor: pointer; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        .center-panel.expanded { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 95vmin; height: 95vmin; border-radius: 50%; 
            background: black; border: 3px solid var(--chakra-color);
            box-shadow: 0 0 60px var(--chakra-color); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: hidden;
        }

        /* ISI LINGKARAN */
        #circle-content { display: none; width: 85%; height: 85%; margin-top: 8%; overflow-y: auto; scrollbar-width: none; }
        .section-title { border-bottom: 1px dashed red; padding-bottom: 5px; margin: 15px 0 10px 0; font-size: 1rem; color: gold; }
        
        /* CHAT UI */
        .chat-box { height: 120px; overflow-y: auto; border: 1px solid #333; padding: 5px; margin-bottom: 5px; font-size: 0.7rem; text-align: left; background: #0a0a0a; }
        .chat-msg { border-bottom: 1px solid #222; padding: 3px 0; display: flex; justify-content: space-between; }
        .chat-meta { color: #555; font-size: 0.6rem; }
        .del-btn { color: red; cursor: pointer; margin-left: 5px; font-weight: bold; }
        .input-group { display: flex; gap: 5px; }
        .input-group input { background: #111; border: 1px solid #333; color: white; flex: 1; padding: 5px; }
        .input-group button { background: red; color: black; border: none; font-weight: bold; cursor: pointer; }

        /* GALLERY UI */
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .gallery-item { position: relative; border: 1px solid #333; height: 100px; overflow: hidden; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        .gallery-del { position: absolute; top: 0; right: 0; background: red; color: white; padding: 2px 5px; font-size: 0.7rem; cursor: pointer; }

        .close-circle { 
    position: absolute; bottom: 15px;
    background: var(--chakra-color); /* JADI MERAH FULL */
    color: black; /* Teks jadi hitam biar terbaca */
    border: none;
    padding: 8px 30px; 
    border-radius: 20px; 
    font-weight: bold;
    cursor: pointer; 
    display: none;
    box-shadow: 0 0 15px var(--chakra-color); /* Efek cahaya merah */
    transition: transform 0.2s;
}

.close-circle:hover {
    transform: scale(1.1); /* Membesar dikit pas disentuh */
    box-shadow: 0 0 25px red;
}
        .center-panel.expanded .close-circle { display: block; }

        /* TOMBOL & ANIMASI */
        .ninja-btn { background: var(--chakra-color); border: none; color: black; font-size: 2rem; cursor: pointer; padding: 20px; }
        .spin-right { 
    animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1); /* Pakai efek ngebut-rem */
}
/* Animasi Putar 3x (Lebih Cepat & Agresif) */
@keyframes spin { 
    0% { transform: rotate(0deg); }
    100% { transform: rotate(1080deg); } /* 360 x 3 = 1080 derajat */
}

/* Update class spin-right biar durasinya pas untuk 3 putaran */
.social-vertical { display: flex; flex-direction: column; gap: 15px; }
        .social-link { color: white; font-size: 1.5rem; transition: 0.3s; }
        .social-link:hover { color: red; transform: scale(1.2); }
        
        /* MODAL PASS */
        #pass-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; display:none; justify-content:center; align-items:center; }
        .modal-box { border: 1px solid red; padding: 20px; background: black; text-align: center; }
        .grid-item { animation: borderPulse 4s infinite alternate; }
        @keyframes borderPulse {
            0% { box-shadow: inset 0 0 5px rgba(255,0,0,0.1); }
            100% { box-shadow: inset 0 0 15px rgba(255,0,0,0.3); }
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-red-fog-in-a-dark-forest-4248-large.mp4" type="video/mp4">
    </video>

    <div id="pass-modal">
        <div class="modal-box">
            <h3>🔒 AKSES TERKUNCI</h3>
            <input type="password" id="secret-code" placeholder="***" style="background:#111; border:1px solid red; color:white; padding:5px; text-align:center;">
            <br><br>
            <button onclick="checkPass()" style="background:red; border:none; padding:5px 15px; font-weight:bold;">BUKA</button>
            <button onclick="document.getElementById('pass-modal').style.display='none'" style="background:none; border:1px solid #333; color:#aaa; padding:5px 15px;">BATAL</button>
        </div>
    </div>

    <div class="grid-container">
        
        <div class="grid-item"><button class="ninja-btn" onclick="execIndodax(this)"><i class="fas fa-robot"></i></button></div>
        <div class="grid-item" id="sys-01"><span class="sys-label">SYS.01</span><small>// STANDBY</small></div>
        <div class="grid-item"><button class="ninja-btn" onclick="execSosmed(this)"><i class="fas fa-database"></i></button></div>

        <div class="grid-item" id="sys-04"><span class="sys-label">SYS.04</span><small>// NO MEDIA</small></div>
        
        <div class="grid-item center-panel" id="center-panel" onclick="expandHub()">
            <h2 id="main-title" style="margin:0; text-shadow: 0 0 10px red;">UCHIHA EZRA</h2>
            <p id="main-status" style="font-size: 0.7rem; color: #aaa;">// SYSTEM V.7</p>
            
            <div id="circle-content" onclick="event.stopPropagation()">
                <div style="text-align:center;">
                    <h3 style="margin:0; color:gold;">UCHIHA EZRA</h3>
                    <p style="font-size:0.7rem;">FULL STACK SHINOBI</p>
                    <p style="font-size:0.7rem; color:#0f0;">STATUS: ONLINE</p>
                </div>

                <div class="section-title">💬 LIVE CHAT</div>
                <div id="chat-display" class="chat-box">Loading...</div>
                <div class="input-group">
                    <input type="text" id="chat-msg" placeholder="Pesan...">
                    <button onclick="sendChat()">KIRIM</button>
                </div>

                <div class="section-title">🗂️ MOMENT VAULT</div>
                <div class="input-group" style="margin-bottom:10px;">
                    <input type="file" id="gh-file">
                    <button onclick="uploadGithub()">UPLOAD</button>
                </div>
                <div id="gallery-display" class="gallery-grid">Loading GitHub...</div>
            </div>

            <button class="close-circle" onclick="closeHub(event)">TUTUP</button>
        </div>

        <div class="grid-item" id="sys-06"><span class="sys-label">SYS.06</span><small>// ENCRYPTED</small></div>

        <div class="grid-item"><button class="ninja-btn" onclick="execMusic(this)"><i class="fas fa-music"></i></button></div>
        <div class="grid-item" id="sys-08"><span class="sys-label">SYS.08</span><small>// LOCKED</small></div>
        <div class="grid-item"><button class="ninja-btn" onclick="openPass(this)"><i class="fas fa-eye"></i></button></div>

    </div>

    <script>
        // --- KONFIGURASI (WAJIB ISI!) ---
        const CONFIG = {
            WORKER: "https://uchiha-backend.ezra.workers.dev", // Ganti dengan URL Worker kamu
            GH_TOKEN: "ISI_TOKEN_GITHUB_DISINI", // Token GitHub (repo scope)
            GH_USER: "uchihaezra",
            GH_REPO: "uchihaezra",
            PASS: "konoha" // Password Rahasia
        };

        const SOSMED = { wa: "https://wa.me/628123456789", ig: "https://instagram.com/uchihaezra", dana: "https://dana.id" };

        // --- 1. VISITOR TRACKER (AUTO) ---
        fetch(`${CONFIG.WORKER}/api/visitor`, { 
            method: "POST", 
            body: JSON.stringify({ referrer: document.referrer }),
            headers: { "Content-Type": "application/json" }
        });

        // --- 2. CHAT SYSTEM ---
        async function loadChat() {
            const display = document.getElementById('chat-display');
            try {
                const res = await fetch(`${CONFIG.WORKER}/api/chat`);
                const data = await res.json();
                display.innerHTML = data.map(m => `
                    <div class="chat-msg">
                        <div>
                            <span class="chat-meta">[${m.ip}] ${m.date.split(' ')[1]}</span><br>
                            ${m.text}
                        </div>
                        <div class="del-btn" onclick="delChat('${m.id}')">X</div>
                    </div>`).join('');
            } catch { display.innerHTML = "Error load chat"; }
        }

        async function sendChat() {
            const input = document.getElementById('chat-msg');
            if(!input.value) return;
            await fetch(`${CONFIG.WORKER}/api/chat`, { method: "POST", body: JSON.stringify({ text: input.value }) });
            input.value = ""; loadChat();
        }

        async function delChat(id) {
            if(confirm("Hapus pesan?")) {
                await fetch(`${CONFIG.WORKER}/api/chat`, { method: "DELETE", body: JSON.stringify({ id }) });
                loadChat();
            }
        }

        // --- 3. GITHUB VAULT (UPLOAD & DELETE) ---
        async function loadGallery() {
            const display = document.getElementById('gallery-display');
            const url = `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/vault`;
            try {
                const res = await fetch(url, { headers: { Authorization: `token ${CONFIG.GH_TOKEN}` } });
                const files = await res.json();
                if(Array.isArray(files)) {
                    display.innerHTML = files.map(f => {
                        let content = f.name.match(/\.(mp4|webm)$/i) ? 
                            `<video src="${f.download_url}" controls></video>` : 
                            `<img src="${f.download_url}">`;
                        return `<div class="gallery-item">${content}<div class="gallery-del" onclick="delGithub('${f.sha}', '${f.path}')">HAPUS</div></div>`;
                    }).join('');
                } else { display.innerHTML = "Folder kosong"; }
            } catch { display.innerHTML = "Gagal koneksi GitHub"; }
        }

        async function uploadGithub() {
            const input = document.getElementById('gh-file');
            if(!input.files.length) return alert("Pilih file!");
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async function() {
                const content = reader.result.split(',')[1];
                const path = `vault/${Date.now()}_${file.name}`;
                await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
                    method: "PUT",
                    headers: { Authorization: `token ${CONFIG.GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Upload Vault", content: content })
                });
                alert("Upload Sukses!"); loadGallery();
            };
            reader.readAsDataURL(file);
        }

        async function delGithub(sha, path) {
            if(confirm("Hapus file ini permanen?")) {
                await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
                    method: "DELETE",
                    headers: { Authorization: `token ${CONFIG.GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Delete Vault", sha: sha })
                });
                loadGallery();
            }
        }

        // --- 4. INDODAX BOT ---
        async function execIndodax(btn) {
            animate(btn, "FETCH IDR");
            const p = document.getElementById('sys-01');
            p.innerHTML = `<span class="sys-label">SYS.01</span><span style="color:yellow">AUTH...</span>`;
            try {
                const res = await fetch(`${CONFIG.WORKER}/api/indodax`);
                const d = await res.json();
                if(d.success === 1) {
                    p.innerHTML = `<span class="sys-label">SYS.01</span><div style="text-align:left; font-size:0.7rem;">
                    <strong style="color:gold">SALDO AKUN</strong><br>
                    IDR: ${parseInt(d.return.balance.idr).toLocaleString()}<br>
                    BTC: ${d.return.balance.btc}</div>`;
                } else { throw new Error(); }
            } catch { p.innerHTML = `<span class="sys-label">SYS.01</span><span style="color:red">API FAIL</span>`; }
        }

        // --- 5. VISITOR LOG (SECRET) ---
        function openPass(btn) { animate(btn, "AUTH"); document.getElementById('pass-modal').style.display='flex'; }
        async function checkPass() {
            if(document.getElementById('secret-code').value === CONFIG.PASS) {
                document.getElementById('pass-modal').style.display='none';
                const p = document.getElementById('sys-08');
                p.innerHTML = "Loading...";
                const res = await fetch(`${CONFIG.WORKER}/api/visitor`);
                const d = await res.json();
                p.innerHTML = `<span class="sys-label">SYS.08</span><div style="text-align:left; font-size:0.6rem; overflow:auto; height:100%;">
                <div style="color:lime">TOTAL: ${d.count}</div>
                ${d.logs.map(l => `<div>> ${l.time.split(',')[1]} | ${l.ip}</div>`).join('')}</div>`;
            } else { alert("SALAH!"); }
        }

        // --- HELPER & ANIMASI ---
        function animate(btn, t) {
            let i = btn.querySelector('i'); i.classList.add('spin-right');
            document.getElementById('main-status').innerText = `// EXEC: ${t}`;
            setTimeout(() => { i.classList.remove('spin-right'); document.getElementById('main-status').innerText = `// SYSTEM V.7`; }, 1000);
        }
        function expandHub() {
            document.getElementById('center-panel').classList.add('expanded');
            document.getElementById('circle-content').style.display = 'block';
            document.getElementById('main-title').style.display = 'none';
            loadChat(); loadGallery();
        }
        function closeHub(e) { e.stopPropagation(); document.getElementById('center-panel').classList.remove('expanded'); document.getElementById('circle-content').style.display = 'none'; document.getElementById('main-title').style.display = 'block'; }
        function execSosmed(btn) { animate(btn, "SOSMED"); document.getElementById('sys-06').innerHTML = `<span class="sys-label">SYS.06</span><div class="social-vertical"><a href="${SOSMED.wa}" class="social-link"><i class="fab fa-whatsapp"></i></a><a href="${SOSMED.ig}" class="social-link"><i class="fab fa-instagram"></i></a><a href="${SOSMED.dana}" class="social-link"><i class="fas fa-wallet"></i></a></div>`; }
        function execMusic(btn) { animate(btn, "MEDIA"); document.getElementById('sys-04').innerHTML = `<span class="sys-label">SYS.04</span><video style="width:90%; border:1px solid red;" autoplay loop controls><source src="https://assets.mixkit.co/videos/preview/mixkit-cyberpunk-city-at-night-aerial-view-4509-large.mp4"></video>`; }
    </script>
</body>
</html>
